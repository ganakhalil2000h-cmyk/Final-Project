<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة النتائج</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">نظام إدارة النتائج</h2>
        <div id="errorBox" class="alert alert-danger d-none"></div>
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label">اسم الطالب</label>
                <input type="text" id="studentName" class="form-control" placeholder="اكتب اسم الطالب">
            </div>
            <div class="col-md-4">
                <label class="form-label">درجة المادة الأولى</label>
                <input type="number" id="grade1" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">درجة المادة الثانية</label>
                <input type="number" id="grade2" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">درجة المادة الثالثة</label>
                <input type="number" id="grade3" class="form-control">
            </div>
            <div class="col-md-12">
                <label class="form-label">نسبة الحضور %</label>
                <input type="number" id="attendance" class="form-control">
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button id="addBtn" class="btn btn-primary flex-fill">إضافة طالب</button>
            <button id="committeeBtn" class="btn btn-warning flex-fill">تفعيل لجنة الرأفة</button>
        </div>
    </div>
    <div class="card shadow p-4 mt-4">
        <h4>قائمة الطلاب</h4>
        <div id="studentsListBox" class="mt-3"><p class="text-muted">لا يوجد طلاب بعد</p></div>
    </div>
    <div class="card shadow p-4 mt-4 mb-5">
        <h4>التقرير النهائي</h4>
        <div id="reportBox" class="mt-3"><p class="text-muted">لم يتم تفعيل لجنة الرأفة بعد</p></div>
    </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
